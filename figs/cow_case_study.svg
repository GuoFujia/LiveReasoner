<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="365" viewBox="0 0 1100 365"><rect width="1100" height="365" fill="white"/><g font-family="Arial,sans-serif"><text x="550" y="39" text-anchor="middle" font-size="25" font-weight="bold" fill="#24314c">Cow Feeding: Qualitative Reasoning Comparison</text><rect x="32" y="75" width="500" height="236" rx="14" fill="#fff3f1" stroke="#e7bab6" stroke-width="2"/><rect x="567" y="75" width="500" height="236" rx="14" fill="#eef8f2" stroke="#abd2b8" stroke-width="2"/><text x="282" y="111" text-anchor="middle" font-weight="bold" font-size="21" fill="#943e39">LLaVA-1.5-7B</text><text x="817" y="111" text-anchor="middle" font-weight="bold" font-size="21" fill="#236544">LLaVA + LiveReasoner</text><text x="58" y="160" font-size="17" fill="#463f40">Relies mainly on feeding-stall context</text><text x="58" y="195" font-size="17" fill="#463f40">Notes proximity of head to hay</text><text x="58" y="230" font-size="17" fill="#463f40">Limited verification of mouth activity</text><text x="594" y="160" font-size="17" fill="#2c4939">Examines mouth and forage contact</text><text x="594" y="195" font-size="17" fill="#2c4939">Combines scene with chewing evidence</text><text x="594" y="230" font-size="17" fill="#2c4939">Distinguishes feeding from resting</text><text x="550" y="347" text-anchor="middle" font-size="14" fill="#738092">Textual summary based on the paper's cow case study (not the original figure).</text></g></svg>