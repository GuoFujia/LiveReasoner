<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530"><rect width="1200" height="530" fill="#ffffff"/><text x="600" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="26" fill="#202c44">LiveReasoner: Graph-guided Preference Alignment</text><text x="600" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#59677d">Simplified schematic of the framework described in the paper</text><g font-family="Arial,sans-serif"><rect x="30" y="118" width="195" height="275" rx="15" fill="#edf7f1" stroke="#8abf9e" stroke-width="2"/><text x="127" y="153" text-anchor="middle" font-size="19" font-weight="bold" fill="#245942">Input</text><text x="127" y="208" text-anchor="middle" font-size="17" fill="#1d3340">Livestock image</text><rect x="56" y="229" width="143" height="52" rx="8" fill="#d9ede0"/><text x="127" y="261" text-anchor="middle" font-size="15" fill="#245942">Target behavior</text><rect x="56" y="299" width="143" height="52" rx="8" fill="#d9ede0"/><text x="127" y="331" text-anchor="middle" font-size="15" fill="#245942">Instruction</text><rect x="267" y="118" width="350" height="275" rx="15" fill="#f0f2fc" stroke="#9ba6d7" stroke-width="2"/><text x="442" y="153" text-anchor="middle" font-size="19" font-weight="bold" fill="#2c4073">Graph Knowledge Generation</text><rect x="295" y="184" width="294" height="73" rx="9" fill="#dce2fa"/><text x="442" y="214" text-anchor="middle" font-size="17" fill="#25365d">Behavior Scene Graph</text><text x="442" y="236" text-anchor="middle" font-size="13" fill="#45567a">Entities, postures and relations</text><path d="M442 262 V287" stroke="#596ca6" stroke-width="3"/><path d="M435 280 L442 291 L449 280" fill="none" stroke="#596ca6" stroke-width="3"/><rect x="295" y="294" width="294" height="73" rx="9" fill="#dce2fa"/><text x="442" y="325" text-anchor="middle" font-size="17" fill="#25365d">Behavior Logic Graph</text><text x="442" y="347" text-anchor="middle" font-size="13" fill="#45567a">Facts, support and exclusion</text><rect x="659" y="118" width="302" height="275" rx="15" fill="#fff6e9" stroke="#e3bf87" stroke-width="2"/><text x="810" y="153" text-anchor="middle" font-size="19" font-weight="bold" fill="#77522c">Reasoning Preferences</text><rect x="688" y="188" width="244" height="70" rx="9" fill="#e3f3e7"/><text x="810" y="216" text-anchor="middle" font-size="17" fill="#245b39">Positive CoT</text><text x="810" y="239" text-anchor="middle" font-size="13" fill="#375e41">Evidence-consistent</text><rect x="688" y="279" width="244" height="86" rx="9" fill="#f9e5e4"/><text x="810" y="306" text-anchor="middle" font-size="17" fill="#8d3935">Negative CoT</text><text x="810" y="329" text-anchor="middle" font-size="12" fill="#814844">Delete · Swap · Inject</text><text x="810" y="348" text-anchor="middle" font-size="12" fill="#814844">Relation Flip · Behavior Replace</text><rect x="1002" y="118" width="172" height="275" rx="15" fill="#f4eefb" stroke="#bda5da" stroke-width="2"/><text x="1088" y="153" text-anchor="middle" font-size="19" font-weight="bold" fill="#5c427e">Fine-tuning</text><rect x="1022" y="191" width="132" height="65" rx="9" fill="#e7daf6"/><text x="1088" y="219" text-anchor="middle" font-size="18" fill="#503770">Stage 1: SFT</text><text x="1088" y="239" text-anchor="middle" font-size="12" fill="#654f80">FLBE dataset</text><rect x="1022" y="287" width="132" height="65" rx="9" fill="#e7daf6"/><text x="1088" y="315" text-anchor="middle" font-size="18" fill="#503770">Stage 2: DPO</text><text x="1088" y="335" text-anchor="middle" font-size="12" fill="#654f80">Preference pairs</text><g stroke="#77859c" stroke-width="3" fill="none"><path d="M225 253 H265"/><path d="M617 253 H657"/><path d="M961 253 H1000"/></g><g fill="#77859c"><path d="M256 247 L266 253 L256 259Z"/><path d="M648 247 L658 253 L648 259Z"/><path d="M991 247 L1001 253 L991 259Z"/></g><text x="600" y="455" text-anchor="middle" font-size="17" font-weight="bold" fill="#26374f">Output: visually grounded, logically consistent livestock behavior explanations</text><text x="600" y="487" text-anchor="middle" font-size="14" fill="#6c7889">This diagram summarizes the method and is not a pixel-identical reproduction of the original paper figure.</text></g></svg>